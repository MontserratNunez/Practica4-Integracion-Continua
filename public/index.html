<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 4 - CI GitHub Actions</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 450px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¡Hola Mundo! 🚀</h1>
    <p>Práctica 4: Integración Continua con GitHub Actions & ntfy.sh</p>
    <div class="status-badge">🟢 Servidor en ejecución</div>
  </div>
</body>
</html>
